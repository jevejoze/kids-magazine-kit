<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面排版 · 前后对比</title><style>body{margin:0;padding:28px;background:#f5f1e9;color:#4a3b32;font:16px "PingFang SC",sans-serif}h1{font-size:26px;margin:0 0 8px}p{margin:0 0 22px;color:#826e60}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1400px}figure{margin:0}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:100%;border-radius:12px;box-shadow:0 6px 24px #4a3b3220}button{font:inherit;border:1px solid #a18b79;border-radius:8px;padding:6px 12px;background:white;color:inherit;cursor:pointer;margin-left:10px}a{color:inherit}</style><h1>小满早知道 · 封面排版对比</h1><p>时间线索提前，问题与角色分栏，人物和署名保留安全距离。照片与正文内容相同。</p><div class="grid"><figure><figcaption>调整前</figcaption><img src="cover-before.png" alt="调整前的封面"></figure><figure><figcaption>调整后<button onclick="const p=this.dataset.png!=='yes';document.getElementById('after').src=p?'cover-after-png.png':'cover-after-svg.png';this.dataset.png=p?'yes':'no';this.textContent=p?'切换为 SVG 角色':'切换为 PNG 角色'">切换为 PNG 角色</button></figcaption><img id="after" src="cover-after-svg.png" alt="调整后的封面"></figure></div></html>
