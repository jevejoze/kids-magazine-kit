<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=block" rel="stylesheet">
<style>
{{STYLE}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CHARACTER_PACK = {{CHARACTER_PACK}};
{{CHARACTERS}}
const D = {{DATA}};
const CAST = {{CAST}};

{{KIT}}
const kit = makeKit(D, CAST);
const { N, ch, bub, topBar, foot, coverFoot, next: NEXT, toc: TOC, cast: GANG, escapeText, wrapChineseWords } = kit;
// 注册了的栏目（sections/<id>/page.js）登记在这里；有数据时按页序调用 render(data, kit)，返回一页或几页的内容
const SECTIONS = {};
{{SECTIONS}}
const PAGE_ORDER = {{PAGE_ORDER}};

const cards = [];
// 按页序走到 key 这一页：先渲染排在它前面、还没渲染的注册栏目；key 自己注册了就走它的 page.js，返回 false，旧代码跳过这一页
const rendered = new Set();
const put = key => {
  rendered.add(key);
  // 一页是一段 HTML，或 { html, class, style }：class、style 加在这一页的 .card 上
  const pages = [].concat(SECTIONS[key].render(D[key], kit)).map(p => typeof p === "string" ? { html: p } : p);
  const id = SECTIONS[key].id ?? key;
  cards.push(`<div class="section" id="${id}">${pages.map(p => `<section class="card${p.class ? ` ${p.class}` : ""}" data-section="${id}"${p.style ? ` style="${p.style}"` : ""}>${p.html}</section>`).join("")}</div>`);
};
// 本期没有的页（没数据）不用先补前面的栏目，等下一个有的页再补
const upTo = key => {
  const stop = key === null ? PAGE_ORDER.length : PAGE_ORDER.indexOf(key);
  for (const k of PAGE_ORDER.slice(0, Math.max(stop, 0))) if (SECTIONS[k] && !rendered.has(k)) put(k);
};
const legacy = key => {
  upTo(key);
  if (!SECTIONS[key]) return true;
  if (PAGE_ORDER.includes(key) && !rendered.has(key)) put(key);
  return false;
};

const hl = (text, word) => word ? text.replace(new RegExp(`\\b(${word}\\w*)`, "i"), "<b>$1</b>") : text;
const lines = n => `<div class="lines">${"<i></i>".repeat(n)}</div>`;

const W = D.words;
if (legacy("words") && W) cards.push(`<section class="card" id="c3">${topBar("🔤 波波鼠单词屋 · Word House", W.grammar ? `✏️ ${W.grammar}` : undefined)}
  <div class="intro">${ch("mouse:wave:190")}<div class="bub en">${W.intro}</div></div>
  ${W.items.map((w, i) => `<div class="box w c${i}"><div class="ico">${w.icon}</div><div class="wd">
    <div class="word en">${w.word}${w.new ? `<em class="fun">新词</em>` : ""}</div>
    <div class="cn fun">${w.cn}</div><div class="ex en">${hl(w.example, w.word)}</div></div></div>`).join("")}
  <div class="box task"><div class="fun">✍️ 轮到你：${W.task}</div>${lines(W.lines || 2)}</div>
  ${foot("主持：波波鼠 Boba Mouse")}</section>`);

// 挑战：sections/challenge
legacy("challenge");

// 真的假的：sections/check
legacy("check");

// 经典连载：sections/serial-{book,music,film,make}，按本期 kind 选一个包
legacy("serial");

// 周末思辨：sections/think
legacy("think");

// 信箱（最后一页）：几句关于本期的问题，孩子口头答、家长拍照或转述都行
const M = D.mailbox;
const picks = (items, many) => `<div class="pick${many ? " many" : ""}">${items.map(x => `<span>${x}</span>`).join("")}</div>`;
const PAGES = TOC.filter(([, t]) => t !== "信箱").map(([e, t]) => e + t);
if (legacy("mailbox") && M) cards.push(`<section class="card" id="c6">${topBar("💌 编辑部信箱 · Mailbox")}
  <div class="box letter fun">${M.hello || M.letter}</div>
  <div class="box checkin fun"><h3>📝 今天这期，告诉编辑部</h3>
    <div class="row"><b>👍 最喜欢哪一页？</b>${picks(PAGES, PAGES.length > 5)}</div>
    <div class="row"><b>👎 哪一页不太喜欢？</b>${picks(PAGES, PAGES.length > 5)}</div>
    <div class="row"><b>今天难不难？</b>${picks(["😴 太简单", "🤔 刚刚好", "🤯 有点难"])}</div>
    <div class="row"><b>💡 今天想到了什么有趣的问题？</b>${lines(2)}</div>
    <div class="row"><b>👀 今天看到了什么有意思的事？</b>${lines(2)}</div>
    ${M.ask_zh ? `<div class="row"><b>❓ ${M.ask_zh}</b>${lines(1)}</div>` : ""}</div>
  ${foot((M.send_note || "说给家长听") + " · 明天见！See you tomorrow!")}</section>`);

upTo(null);
document.getElementById("root").outerHTML = cards.join("\n").replaceAll("{{TOTAL}}", kit.pages());
[...document.querySelectorAll(".card")].at(-1)?.classList?.add("is-last");
// The renderer and narration validator share the same page contract.
const CARD_IDS = {{CARD_IDS}};
// 一个注册栏目可以出几页，几页连在一起算一个 id
const cardId = c => c.closest(".section")?.id ?? c.id;
const actualIds = [...document.querySelectorAll(".card")].map(cardId).filter((id, i, all) => id !== all[i - 1]);
if (JSON.stringify(actualIds) !== JSON.stringify(CARD_IDS)) throw new Error(`页面顺序与数据契约不一致：${actualIds.join(",")}，应为 ${CARD_IDS.join(",")}`);
if (location.hash) { document.body.classList.add("single"); const el = document.querySelector(location.hash); (el.matches(".card") ? el : el.querySelector(".card")).classList.add("on"); }

// 正文偏长时，把这几页最大的那块图缩一点，让页脚回到版心里（卡片或栏目包 id、元素、CSS 变量、最高、最低）
const FIT = [
  ["comic", ".diagram svg", "--comic-diagram-height", 280, 200],
  ["creature", ".card-photo", "--creature-photo-height", 380, 300],
  ["news", ".lead .pic", "--news-lead-height", 320, 240],
];
function fitCards() {
  for (const [id, sel, prop, max, min] of FIT) {
    const card = document.querySelector(`#${id}.card, #${id} > .card`), el = card?.querySelector(sel), foot = card?.querySelector(".foot");
    if (!el || !foot || !card.getBoundingClientRect().height) continue;
    card.style.setProperty(prop, `${max}px`);
    const limit = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom);
    const excess = Math.max(0, Math.ceil(foot.getBoundingClientRect().bottom - limit));
    card.style.setProperty(prop, `${Math.max(min, max - excess)}px`);
  }
}
function fitChallengeLayout() {
  const card = document.querySelector("#challenge > .card"), foot = card?.querySelector(".foot");
  if (!foot || !card.getBoundingClientRect().height) return;
  card.classList.remove("challenge-compact", "challenge-roomy");
  const limit = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom);
  const overflows = () => foot.getBoundingClientRect().bottom > limit + 1;
  if (overflows()) return card.classList.add("challenge-compact");
  const puz = card.querySelector(".puz"), key = card.querySelector(".answer-key");
  if (puz && key && !card.classList.contains("with-english") && key.getBoundingClientRect().top - puz.getBoundingClientRect().bottom > 150) {
    card.classList.add("challenge-roomy");
    if (overflows()) card.classList.remove("challenge-roomy");
  }
}
// 栏目包的 page.js 可以再导出 ready(data, kit)：页面排好后要做的异步收尾（如封面取色），截图前等它做完
window.READY = Promise.all([...[...rendered].map(k => SECTIONS[k].ready?.(D[k], kit)), characterPackReady]).then(async () => {
  await document.fonts?.ready;
  fitCards();
  fitChallengeLayout();
});
</script>
</body>
</html>
