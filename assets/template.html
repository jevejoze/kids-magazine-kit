<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=block" rel="stylesheet">
<style>
{{STYLE}}
</style>
</head>
<body>
<div id="root"></div>
<script>
{{CHARACTERS}}
const D = {{DATA}};

const N = String(D.issue).padStart(3, "0");
const ch = spec => { const [n, m = "normal", s = 180, p = ""] = spec.split(":"); return draw(n, m, +s, p); };
const bub = b => `<div class="bub ${b.lang === "en" ? "en" : "fun"}">${b.text}</div>`;
const topBar = (tag, right) => `<div class="dots"></div><div class="top"><span class="tag fun">${tag}</span><span class="en">${right ?? N}</span></div>`;
let pg = 0;
const foot = left => `<div class="foot"><span class="fun">${left}</span><span class="page en">${++pg} / {{TOTAL}}</span></div>`;
// 页脚的"往后翻"提示：指向下一页；后面没有页了就是空串
const NEXT = name => { const t = TOC.map(x => x[1]), nx = t[t.indexOf(name) + 1]; return nx ? ` · 往后翻：${nx} →` : ""; };
const coverFoot = left => `<div class="foot"><span class="fun">${left}</span></div>`;
// 目录 = 本期实际有的页，顺序和页序一致：今日一问 → (怪物档案) → (单词屋) → 小剧场 → 挑战 → 环球小报 → 真的假的 → 连载 → 信箱
const SERIAL = { book: ["📚", "经典连载", "Story Classics"], music: ["🎵", "音乐盒", "Music Box"], film: ["🎬", "放映室", "Movie Time"], make: ["✂️", "动手做", "Make It"] }[D.serial?.kind];
const TOC = [["🤔", "今日一问"], D.creature && ["🐙", "怪物档案"], D.words && ["🔤", "单词屋"], ["📖", "小剧场"], ["🧩", "挑战"], D.news && ["🌏", "环球小报"], D.check && ["🕵️", "真的假的"], SERIAL?.slice(0, 2), D.think && ["🗣️", "周末思辨"], D.mailbox && ["💌", "信箱"]].filter(Boolean);
const GANG = ["owl:happy:230", "dog:happy:290", "mouse:wave:260", "raccoon:smirk:220"];

const cards = [];

// 1 封面：有 cover.photo 用照片封面，否则用角色封面
// 照片封面：顶部刊名条 + 下方照片。刊名条的颜色取自照片顶部（见文末 coverStrip），照片顶端渐隐进刊名条
const CV = D.cover;
if (CV && CV.photo) cards.push(`<section class="card photo-cover" id="c1"${CV.strip ? ` style="--strip:${CV.strip}"` : ""}>
  <div class="photo" style="background-image:url('${CV.photo}');background-position:${CV.photo_pos || "center"}"></div><div class="shade"></div>
  <div class="top"><span>${D.date} · ${D.weather}</span><span class="en">ISSUE ${N}</span></div>
  <div class="mast"><div class="zh fun">${D.masthead.zh}</div><div class="en">${D.masthead.en}</div></div>
  <div class="q">${CV.stamp ? `<div class="stamp en">${CV.stamp}</div>` : ""}${CV.asked_by ? `<div class="asked fun">💡 本期问题由${CV.asked_by}提出</div>` : ""}
    <div class="t fun">${D.question.zh}</div><div class="en">${D.question.en}</div></div>
  ${CV.crew ? `<div class="crew">${CV.crew_say ? `<div class="bub fun">${CV.crew_say}</div>` : ""}<div class="chs">${CV.crew.map(ch).join("")}</div></div>` : ""}
  <div class="credit en">${CV.credit}</div></section>`);
else cards.push(`<section class="card" id="c1"><div class="dots"></div>
  <div class="top"><span>${D.date} · ${D.weather}</span><span class="en">ISSUE ${N}</span></div>
  <div class="mast"><div class="zh fun">${D.masthead.zh}</div><div class="en">${D.masthead.en}</div></div>
  ${D.badge ? `<div class="badge fun">${D.badge.zh}<small class="en">${D.badge.en}</small></div>` : ""}
  <div class="gang">${(D.cover_gang || GANG).map(ch).join("")}</div>
  <div class="box q"><div class="lb fun">🐶 今天团子狗想知道……</div>
    <div class="t fun">${D.question.zh}</div><div class="en">${D.question.en}</div></div>
  <div class="toc fun">${TOC.map(([e, t]) => `<div><b>${e}</b>${t}</div>`).join("")}</div>
  ${coverFoot(D.cover_greeting || "编辑部全员向你问好！Hello!")}</section>`);

// 2 今日一问：4 格漫画 + 图解 + 便利贴冷知识
const C = D.comic;
const hl = (text, word) => word ? text.replace(new RegExp(`\\b(${word}\\w*)`, "i"), "<b>$1</b>") : text;
const lines = n => `<div class="lines">${"<i></i>".repeat(n)}</div>`;
const chatRow = (b, bi, p, pi) => {
  const whoKey = (b.who || p.chars[bi] || p.chars[0] || "").split(":")[0];
  const side = b.side || (p.bubbles.length > 1 ? (bi % 2 === 0 ? "left" : "right") : (pi % 2 === 0 ? "left" : "right"));
  const ava = `<div class="chat-ava ${whoKey}">${draw(whoKey, "happy", 96)}</div>`;
  const bub = `<div class="bub who-${whoKey} ${side} ${b.lang === "en" ? "en" : "fun"}">${b.text}</div>`;
  return `<div class="chat-row ${side}">${side === "left" ? ava + bub : bub + ava}</div>`;
};
cards.push(`<section class="card" id="c2">${topBar(`${C.theme_icon || "🤔"} 今日一问 · Big Question`, C.tool ? `<span class="toolpill fun">🧰 ${C.tool}</span>` : undefined)}
  <div class="h1 fun">${C.title_zh || D.question.zh}<span class="en">${C.title_en || D.question.en}</span></div>
  <div class="grid">${C.panels.map((p, i) => `<div class="box panel p${i}"><span class="n en">${i + 1}</span>
    <div class="bubs ${p.bubbles.length > 1 ? "pair" : "solo"}">${p.bubbles.map((b, bi) => chatRow(b, bi, p, i)).join("")}</div></div>`).join("")}</div>
  ${C.diagram ? `<div class="box diagram"><div class="dl fun">🦉 咕咕博士画给你看</div>${C.diagram}</div>` : ""}
  <div class="fact fun"><b>💡 冷知识</b>${C.fact}</div>
  ${foot(C.host || "主持：团子狗 × 咕咕博士")}</section>`);

// 传说怪物档案（每周一张，有 creature 时）：一张可收集的卡片——传说、科学家怎么说、真实原型
const CR = D.creature;
const meter = (n, icon) => `<span class="meter">${icon.repeat(n)}<i>${icon.repeat(5 - n)}</i></span>`;
if (CR) cards.push(`<section class="card" id="cdeep">${topBar(CR.series || "🐙 传说怪物档案 · Legend Files", `No.${String(CR.no).padStart(3, "0")}`)}
  <div class="card-photo"><div class="box half legend"><div class="pic" style="background-image:url('${CR.legend}');background-position:${CR.legend_pos || "center"}"></div>
      <div class="lab fun">📜 传说里的样子</div><div class="credit3 en">${CR.legend_credit}</div></div>
    <div class="box half real"><div class="pic" style="background-image:url('${CR.photo}');background-position:${CR.photo_pos || "center"}"></div>
      <div class="lab fun">📷 可能的真身</div>${CR.tag ? `<div class="depth fun">${CR.tag}</div>` : ""}<div class="credit3 en">${CR.credit}</div></div></div>
  <div class="name"><div class="zh fun">${CR.name_zh}</div>
    <div class="en">${CR.parts.map(p => `<span><b>${p.en}</b><small class="fun">${p.zh}</small></span>`).join("<em>+</em>")}</div></div>
  <div class="stats">${CR.stats.map(s => `<div class="box st"><small class="fun">${s.k}</small><b class="fun">${s.v}</b></div>`).join("")}</div>
  <div class="box meters fun">${CR.meters.map(m => `<div>${m.label} ${meter(m.n, m.icon)}</div>`).join("")}</div>
  ${CR.boxes.map((x, i) => `<div class="box power fun b${i}"><b>${x.title}</b>${x.text}</div>`).join("")}
  ${CR.fast ? `<div class="brains">
    <div class="br">${ch("dog:surprise:120")}<div class="bub fun"><small>快脑袋：</small>${CR.fast}</div></div>
    <div class="br slow">${ch("owl:think:120:magnifier")}<div class="bub fun"><small>慢脑袋：</small>${CR.slow}</div></div></div>` : ""}
  ${foot(CR.foot || `收集怪物卡，凑齐一本档案！${NEXT("怪物档案")}`)}</section>`);
const W = D.words;
if (W) cards.push(`<section class="card" id="c3">${topBar("🔤 波波鼠单词屋 · Word House", W.grammar ? `✏️ ${W.grammar}` : undefined)}
  <div class="intro">${ch("mouse:wave:190")}<div class="bub en">${W.intro}</div></div>
  ${W.items.map((w, i) => `<div class="box w c${i}"><div class="ico">${w.icon}</div><div class="wd">
    <div class="word en">${w.word}${w.new ? `<em class="fun">新词</em>` : ""}</div>
    <div class="cn fun">${w.cn}</div><div class="ex en">${hl(w.example, w.word)}</div></div></div>`).join("")}
  <div class="box task"><div class="fun">✍️ 轮到你：${W.task}</div>${lines(W.lines || 2)}</div>
  ${foot("主持：波波鼠 Boba Mouse")}</section>`);

// 4 连载小剧场：上面是阁楼场景，下面是故事
const ST = D.story;
const ATTIC = `<svg class="bg" viewBox="0 0 952 340" preserveAspectRatio="none"><path d="M0 0 H952 V250 H0z" fill="#FFF1D6"/>
  <path d="M0 0 L300 0 L0 150z M952 0 L652 0 L952 150z" fill="#E7C9A0"/><path d="M0 150 L300 0 M952 150 L652 0" stroke="#4A3B32" stroke-width="5"/>
  <circle cx="476" cy="96" r="62" fill="${ST.night ? "#2D3A66" : "#BFE3FF"}" stroke="#4A3B32" stroke-width="6"/><path d="M476 34 V158 M414 96 H538" stroke="#4A3B32" stroke-width="5"/>
  ${ST.night ? `<circle cx="452" cy="74" r="14" fill="#FFE58F"/>` : ""}
  <path d="M0 250 H952 V340 H0z" fill="#D9A465"/><path d="M0 250 H952" stroke="#4A3B32" stroke-width="5"/>
  <path d="M40 300 h90 M300 320 h120 M640 296 h110" stroke="#B9844A" stroke-width="5" stroke-linecap="round"/>
  <rect x="780" y="180" width="120" height="90" fill="#E7B97F" stroke="#4A3B32" stroke-width="5"/><rect x="808" y="130" width="80" height="54" fill="#D9A465" stroke="#4A3B32" stroke-width="5"/></svg>`;
const renderStory = ST => {
  if (ST.paragraphs && ST.paragraphs.length <= 4) {
    const actHtml = ST.paragraphs.map((p, i) => {
      const hasOwl = p.includes("咕咕博士") || p.includes("博士");
      const hasMouse = p.includes("波波鼠");
      const hasDog = p.includes("团子狗");
      const hasRaccoon = p.includes("浣熊");
      const quotes = [...p.matchAll(/“([^”]+)”/g)].map(m => m[1]);
      const cleanNar = p.replace(/“[^”]+”/g, "").replace(/：\s*/g, " ").trim();

      if (hasMouse && hasDog && quotes.length >= 2) {
        return `<div class="act duo-act">
          <div class="duo-row mouse-row"><div class="char-fig">${draw("mouse", "wave", 100)}</div><div class="bub fun">“${quotes[0]}”</div></div>
          <div class="duo-row dog-row"><div class="bub fun">“${quotes[1]}”</div><div class="char-fig">${draw("dog", "happy", 104)}</div></div>
        </div>`;
      }
      if (hasOwl) {
        return `<div class="act owl-act"><div class="char-fig">${draw("owl", "talk", 124, "magnifier")}</div>
          <div class="act-txt"><div class="bub fun">“${quotes.length ? quotes.join(" ") : p}”</div>${cleanNar ? `<div class="nar">${cleanNar}</div>` : ""}</div></div>`;
      }
      if (hasRaccoon) {
        return `<div class="act raccoon-act"><div class="char-fig">${draw("raccoon", "smirk", 124)}</div>
          <div class="act-txt">${quotes.length ? `<div class="bub fun">“${quotes.join(" ")}”</div>` : ""}<div class="nar">${quotes.length ? cleanNar : p}</div></div></div>`;
      }
      const charKey = (ST.scene[i] || "dog").split(":")[0];
      return `<div class="act general-act"><div class="char-fig">${draw(charKey, "happy", 110)}</div>
        <div class="act-txt">${quotes.length ? `<div class="bub fun">“${quotes.join(" ")}”</div>` : ""}<div class="nar">${quotes.length ? cleanNar : p}</div></div></div>`;
    }).join("");

    return `<div class="story-acts">${actHtml}</div>
      ${ST.clue ? `<div class="clue-box fun"><div class="key-icon">🔑</div><div class="clue-txt"><b>关键线索</b><span>${ST.clue}</span></div></div>` : ""}
      <div class="tbc fun"><span>📦 ${ST.tbc}</span></div>`;
  }

  return `<div class="box stage">${ATTIC}<div class="scene">${ST.scene.map(ch).join("")}</div></div>
    <div class="story ${ST.lang === "en" ? "en" : ""}">${ST.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>
    <div class="tbc fun"><span>${ST.tbc}</span>${ST.clue ? `<span class="clue">🔍 ${ST.clue}</span>` : ""}</div>`;
};
cards.push(`<section class="card" id="c4">${topBar("📖 编辑部小剧场 · Story Time", "EP." + ST.ep)}
  <div class="h1 fun">第${ST.ep}集　${ST.title_zh}<span class="en">${ST.title_en}</span></div>
  ${renderStory(ST)}
  ${foot(ST.foot || `编辑部推理连载${NEXT("小剧场")}`)}</section>`);

// 挑战卡
const P = D.challenge;
if (P) cards.push(`<section class="card" id="c5">${topBar("🧩 捣蛋浣熊的挑战 · Brain Teaser")}
  <div class="taunt">${ch("raccoon:smirk:160:" + (P.prop || ""))}<div class="bub fun">${P.taunt_zh}<br><span class="en">${P.taunt_en}</span></div></div>
  <div class="box puz fun"><h3>${P.puzzle.title}</h3><div class="body">${P.puzzle.body}</div>
    ${P.puzzle.slots ? `<div class="slots">${P.puzzle.slots.map(x => `<span>${x}</span>`).join("")}</div>` : ""}</div>
  ${P.english?.length ? `<div class="route">${P.english.map((e, i) => `<div class="box lv l${i}"><div class="st fun">第${i + 1}关<b>${"⭐".repeat(e.stars)}</b></div>
    <div class="q"><div class="cn fun">${e.cn}</div><div class="en">${e.en}</div>${e.stars === 3 ? lines(2) : ""}</div></div>`).join("")}</div>`
    : `<div class="draft fun"><h3>✏️ 演算草稿手账 · 💡 浣熊锦囊：细心验算每一个线索哦！</h3><div class="stamp"><span>🏆 通关印</span><b>留念</b></div></div>
  ${P.puzzle.slots ? "" : `<div class="box mine fun"><b>我的答案：</b>${lines(1)}</div>`}`}
  ${foot("答案明天公布！")}</section>`);

// 环球小报（可选）：1 条头条 + 2 条小新闻
const NW = D.news;
const story = (n, cls) => `<div class="box nw ${cls}"><div class="pic" style="background-image:url('${n.photo}');background-position:${n.photo_pos || "center"}"></div>
  <div class="txt"><div class="loc fun">${n.flag} ${n.place}</div><h3 class="fun">${n.title}</h3><p>${n.text}${n.word ? `<span class="kw en">🔑 ${n.word.en} <small class="fun">${n.word.zh}</small></span>` : ""}</p></div></div>`;
if (NW) cards.push(`<section class="card" id="cnews">${topBar("🌏 环球小报 · World News", NW.week)}
  ${story(NW.items[0], "lead")}
  <div class="pair">${NW.items.slice(1, 3).map(n => story(n, "")).join("")}</div>
  <div class="box ask2 fun">💬 ${NW.ask_zh}<br><span class="en">${NW.ask_en}</span></div>
  <div class="credit2 en">${NW.credits}</div>
  ${foot(NW.foot || `新闻来源已交叉核实${NEXT("环球小报")}`)}</section>`);

// 真的假的（每天一页）：一条网上流传的说法，快脑袋先投票，慢脑袋按线索查，答案倒着印；有思维课表时选项和查证工具跟着本周换
const CK = D.check;
const CK_CHOICES = CK?.choices ?? ["✅ 真的", "❌ 假的", "🤔 说不清"];
const CK_TOOLS = CK?.tools ?? [["👤 谁说的？", "他怎么知道的"], ["🧪 有证据吗？", "实验、照片、数字"], ["📚 别处怎么说？", "再找一个来源"]];
if (CK) cards.push(`<section class="card" id="ccheck">${topBar("🕵️ 真的假的 · True or False?")}
  <div class="box post${CK.photo ? " has-pic" : ""}"><div class="txt"><div class="ph fun">📱 ${CK.where}</div><div class="claim fun">${CK.claim}</div><div class="likes en">👍 ${CK.likes || "10万+"}　💬 ${CK.comments || "2,333"}</div></div>
    ${CK.photo ? `<div class="pic" style="background-image:url('${CK.photo}');background-position:${CK.photo_pos || "center"}"></div>` : ""}</div>
  <div class="vote fun">你的快脑袋说：${CK_CHOICES.map(c => `<span>${c}</span>`).join("")}</div>
  <div class="tools fun">${CK_TOOLS.map(([t, s]) => `<span>${t}<small>${s}</small></span>`).join("")}</div>
  <div class="box clues fun"><h3>🦉 慢脑袋查一查</h3>${CK.clues.map((c, i) => `<p><b>${i + 1}</b>${c}</p>`).join("")}</div>
  <div class="box mine fun"><h3>🕵️ 我的结论：${CK.choices ? CK_CHOICES.map(c => c.replace(/^\S+\s/, "")).join(" / ") : "真 / 假"}，因为……</h3>${lines(2)}</div>
  <div class="upside fun"><span>👀 倒过来看答案：</span>${CK.verdict}</div>
  ${CK.credit ? `<div class="credit2 en">${CK.credit}</div>` : ""}
  ${foot(`看完再倒过来对答案${NEXT("真的假的")}`)}</section>`);

// 经典连载（可选）：书一期一回；周五换成音乐盒 / 放映室 / 动手做
const SR = D.serial;
if (SR) cards.push(`<section class="card ${SR.kind}" id="cserial">${topBar(`${SERIAL[0]} ${SERIAL[1]} · ${SERIAL[2]}`, SR.kind === "book" ? `第 ${SR.ep} 回` : undefined)}
  <div class="h1 fun">${SR.kind === "book" ? `《${SR.book_zh}》` : ""}${SR.title_zh}<span class="en">${SR.kind === "book" ? `${SR.book_en} · ${SR.title_en}` : SR.title_en}</span></div>
  <div class="meta fun">${SR.kind === "book" ? `${SR.chapter}　·　${SR.author}` : SR.by}</div>
  ${(SR.diagram || SR.steps) && SR.photo ? `<div class="box done"><div class="img" style="background-image:url('${SR.photo}');background-position:${SR.photo_pos || "center"}"></div><div class="lb fun">做好是这样</div><div class="credit3 en">${SR.photo_credit}</div></div>` : ""}
  <div class="text">${SR.diagram || SR.steps ? "" : `<div class="box pic"><div class="img" style="background-image:url('${SR.photo}');background-position:${SR.photo_pos || "center"}"></div><div class="credit3 en">${SR.photo_credit}</div></div>`}
    ${SR.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>
  ${SR.steps
    ? `<div class="box grid fun" style="--cols:${SR.steps.length > 9 ? 4 : 3};--rows:${Math.ceil(SR.steps.length / (SR.steps.length > 9 ? 4 : 3))}">${SR.steps.map((s, i) => `<div class="cell"><div class="img" style="background-image:url('${s}')"></div><p><b>${i + 1}</b>${SR.tasks[i]}</p></div>`).join("")}
    <small>${SR.where ? `${SR.where}　·　` : ""}<span class="en">图式 ${SR.diagram_credit}</span></small></div>`
    : SR.diagram
    ? `<div class="box diagram"><div class="img" style="background-image:url('${SR.diagram}')"></div><div class="credit3 en">${SR.diagram_credit}</div></div>
  <div class="box tasks steps fun">${SR.tasks.map((t, i) => `<p><b>${i + 1}</b>${t}</p>`).join("")}${SR.where ? `<small>${SR.where}</small>` : ""}</div>`
    : SR.kind === "book"
    ? `<div class="box quote"><div class="lb fun">📜 原著金句 · ${SR.quote.who}</div><div class="en">${/^[“"]/.test(SR.quote.en) ? SR.quote.en : `“${SR.quote.en}”`}</div><div class="zh fun">${SR.quote.zh}</div></div>`
    : `<div class="box tasks fun"><div class="lb">${{ music: "🎧 边听边找", film: "🍿 看完考考你", make: "✂️ 跟着做" }[SR.kind]}</div>${SR.tasks.map((t, i) => `<p><b>${i + 1}</b>${t}</p>`).join("")}${SR.where ? `<small>${SR.where}</small>` : ""}</div>`}
  <div class="end"><div class="crew">${ch(SR.crew.who)}<div class="bub fun">${SR.crew.say}</div></div>
    <div class="next fun">${SR.guess ? `<span class="guess">🔮 猜一猜：${SR.guess}</span>` : ""}<span>${SR.tbc}</span></div></div>
  ${foot(SR.foot || NEXT(SERIAL[1]).replace(/^ · /, "") || "明天见！See you tomorrow!")}</section>`);

// 周末思辨（周五）：一个两边都有道理的话题，孩子先写下想法，周六和家人聊
const TK = D.think;
if (TK) cards.push(`<section class="card" id="cthink">${topBar("🗣️ 周末思辨 · Big Talk", "周六聊一聊")}
  <div class="h1 fun">${TK.title}${TK.title_en ? `<span class="en">${TK.title_en}</span>` : ""}</div>

// 刊名条取色：照片可见区域最上面 5% 的平均色；太灰就提一点亮度。JSON 写了 cover.strip 就用它。
// 刊名用深字还是白字，按刊名条的亮度定。render.mjs 截图前会等 window.READY
async function coverStrip() {
  const card = document.querySelector("#c1.photo-cover");
  if (!card) return;
  let rgb;
  if (CV.strip) {
    const c = document.createElement("canvas").getContext("2d");
    c.fillStyle = CV.strip; c.fillRect(0, 0, 1, 1); rgb = [...c.getImageData(0, 0, 1, 1).data].slice(0, 3);
  } else {
    const box = card.querySelector(".photo"), img = new Image();
    img.src = CV.photo; await img.decode();
    const W = box.clientWidth, H = box.clientHeight, s = Math.max(W / img.width, H / img.height);
    const pos = getComputedStyle(box).backgroundPosition.split(" ").map(v => v.endsWith("%") ? parseFloat(v) / 100 : 0.5);
    const vw = W / s, vh = H / s, x0 = (img.width - vw) * pos[0], y0 = (img.height - vh) * (pos[1] ?? 0.5);
    const cv = document.createElement("canvas"); cv.width = 32; cv.height = 2;
    const c = cv.getContext("2d"); c.drawImage(img, x0, y0, vw, vh * 0.05, 0, 0, 32, 2);
    const px = c.getImageData(0, 0, 32, 2).data; rgb = [0, 0, 0];
    for (let i = 0; i < px.length; i += 4) for (let k = 0; k < 3; k++) rgb[k] += px[i + k] / 64;
    const [mx, mn] = [Math.max(...rgb), Math.min(...rgb)];
    if (mx - mn < 30 && mx < 200) rgb = rgb.map(v => Math.min(255, v + 24)); // 灰蒙蒙的天：提亮一点
    card.style.setProperty("--strip", `rgb(${rgb.map(Math.round).join(",")})`);
  }
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  card.classList.add(lum > 0.6 ? "light" : "dark");
}
window.READY = coverStrip();
