<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;800&display=block" rel="stylesheet">
<style>
{{STYLE}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CHARACTER_PACK = {{CHARACTER_PACK}};
{{CHARACTERS}}
const D = {{DATA}};
const CAST = {{CAST}};

{{KIT}}
const kit = makeKit(D, CAST);
const { N, ch, bub, topBar, foot, coverFoot, next: NEXT, serial: SERIAL, toc: TOC, cast: GANG, escapeText, wrapChineseWords } = kit;
// 注册了的栏目（sections/<id>/page.js）登记在这里；有数据时按页序调用 render(data, kit)，返回一页或几页的内容
const SECTIONS = {};
{{SECTIONS}}
const PAGE_ORDER = {{PAGE_ORDER}};

const cards = [];
// 按页序走到 key 这一页：先渲染排在它前面、还没渲染的注册栏目；key 自己注册了就走它的 page.js，返回 false，旧代码跳过这一页
const rendered = new Set();
const put = key => {
  rendered.add(key);
  const pages = [].concat(SECTIONS[key].render(D[key], kit));
  cards.push(`<div class="section" id="${key}">${pages.map(html => `<section class="card" data-section="${key}">${html}</section>`).join("")}</div>`);
};
// 本期没有的页（没数据）不用先补前面的栏目，等下一个有的页再补
const upTo = key => {
  const stop = key === null ? PAGE_ORDER.length : PAGE_ORDER.indexOf(key);
  for (const k of PAGE_ORDER.slice(0, Math.max(stop, 0))) if (SECTIONS[k] && !rendered.has(k)) put(k);
};
const legacy = key => {
  upTo(key);
  if (!SECTIONS[key]) return true;
  if (PAGE_ORDER.includes(key) && !rendered.has(key)) put(key);
  return false;
};

// 1 封面：有 cover.photo 用照片封面，否则用角色封面
// 照片封面：顶部刊名条 + 下方照片。刊名条的颜色取自照片顶部（见文末 coverStrip），照片顶端渐隐进刊名条
const CV = D.cover;
if (legacy("cover") && CV && CV.photo) cards.push(`<section class="card photo-cover" id="c1"${CV.strip ? ` style="--strip:${CV.strip}"` : ""}>
  <div class="photo" style="background-image:url('${CV.photo}');background-position:${CV.photo_pos || "center"}"></div><div class="shade"></div>
  <div class="top"><span>${D.date} · ${D.weather}</span><span class="en">ISSUE ${N}</span></div>
  <div class="mast"><div class="zh fun">${D.masthead.zh}</div><div class="en">${D.masthead.en}</div></div>
  <div class="cover-bottom${CV.crew?.length ? " has-crew" : ""}">
    <div class="q"><div class="cover-labels">${CV.stamp ? `<span class="stamp en">${CV.stamp}</span>` : ""}${CV.asked_by ? `<span class="asked fun">💡 本期问题由${CV.asked_by}提出</span>` : ""}</div>
      <div class="t fun">${wrapChineseWords(D.question.zh)}</div><div class="en">${D.question.en}</div></div>
    ${CV.crew?.length ? `<div class="crew">${CV.crew_say ? `<div class="bub fun">${CV.crew_say}</div>` : ""}<div class="chs">${CV.crew.map(ch).join("")}</div></div>` : ""}
    <div class="credit en">${CV.credit}</div>
  </div></section>`);
else if (legacy("cover")) cards.push(`<section class="card" id="c1"><div class="dots"></div>
  <div class="top"><span>${D.date} · ${D.weather}</span><span class="en">ISSUE ${N}</span></div>
  <div class="mast"><div class="zh fun">${D.masthead.zh}</div><div class="en">${D.masthead.en}</div></div>
  ${D.badge ? `<div class="badge fun">${D.badge.zh}<small class="en">${D.badge.en}</small></div>` : ""}
  <div class="gang">${(D.cover_gang || GANG).map(ch).join("")}</div>
  <div class="box q"><div class="lb fun">🐶 今天团子狗想知道……</div>
    <div class="t fun">${D.question.zh}</div><div class="en">${D.question.en}</div></div>
  <div class="toc fun">${TOC.map(([e, t]) => `<div><b>${e}</b>${t}</div>`).join("")}</div>
  ${coverFoot(D.cover_greeting || "编辑部全员向你问好！Hello!")}</section>`);

// 2 今日一问：4 格漫画 + 图解 + 便利贴冷知识
const C = D.comic;
const hl = (text, word) => word ? text.replace(new RegExp(`\\b(${word}\\w*)`, "i"), "<b>$1</b>") : text;
const lines = n => `<div class="lines">${"<i></i>".repeat(n)}</div>`;
const chatRow = (b, bi, p, pi) => {
  const speaker = b.who || p.chars[bi] || p.chars[0] || "";
  const spec = speaker.includes(":") ? speaker : p.chars.find(s => s.split(":")[0] === speaker) || speaker;
  const [whoKey, mood = "normal", size = "110", props = ""] = spec.split(":");
  const side = b.side || (p.bubbles.length > 1 ? (bi % 2 === 0 ? "left" : "right") : (pi % 2 === 0 ? "left" : "right"));
  const ava = `<div class="chat-ava ${whoKey}">${draw(whoKey, mood, Number(size), props)}</div>`;
  const bub = `<div class="bub who-${whoKey} ${side} ${b.lang === "en" ? "en" : "fun"}"><span class="bubble-text">${b.lang === "en" ? escapeText(b.text) : wrapChineseWords(b.text, false)}</span></div>`;
  return `<div class="chat-row ${side}">${side === "left" ? ava + bub : bub + ava}</div>`;
};
const comicPanels = (panels, start) => panels.map((p, j) => {
  const i = start + j;
  return `<div class="box panel p${i}"><div class="panel-head"><span class="n en">${i + 1}</span>${p.title ? `<span>${p.title}</span>` : ""}</div>
    <div class="bubs ${p.bubbles.length > 1 ? "pair" : "solo"}">${p.bubbles.map((b, bi) => chatRow(b, bi, p, i)).join("")}</div></div>`;
}).join("");
if (legacy("comic")) cards.push(`<section class="card" id="c2">${topBar(`${C.theme_icon || "🤔"} 今日一问 · Big Question`, C.tool ? `<span class="toolpill fun">🧰 ${C.tool}</span>` : undefined)}
  <div class="h1 fun">${wrapChineseWords(C.title_zh || D.question.zh)}<span class="en">${C.title_en || D.question.en}</span></div>
  <div class="grid upper">${comicPanels(C.panels.slice(0, 2), 0)}</div>
  ${C.diagram ? `<div class="box diagram"><div class="dl fun">${C.diagram_title || "🦉 咕咕博士画给你看"}</div>${C.diagram}
    ${C.takeaway ? `<div class="takeaway"><b>所以</b><span>${escapeText(C.takeaway)}</span></div>` : ""}</div>` : ""}
  <div class="grid lower">${comicPanels(C.panels.slice(2), 2)}</div>
  <div class="fact"><b>${C.fact_title || "💡 再发现"}</b><span>${C.fact}</span></div>
  ${foot(C.host || "主持：团子狗 × 咕咕博士")}</section>`);

// 传说怪物档案（每周一张，有 creature 时）：一张可收集的卡片——传说、科学家怎么说、真实原型
const CR = D.creature;
const meter = (n, icon) => `<span class="meter">${icon.repeat(n)}<i>${icon.repeat(5 - n)}</i></span>`;
if (legacy("creature") && CR) cards.push(`<section class="card" id="cdeep">${topBar(CR.series || "🐙 传说怪物档案 · Legend Files", `No.${String(CR.no).padStart(3, "0")}`)}
  <div class="card-photo"><div class="box half legend"><div class="pic" style="background-image:url('${CR.legend}');background-position:${CR.legend_pos || "center"}"></div>
      <div class="lab fun">📜 传说里的样子</div><div class="credit3 en">${CR.legend_credit}</div></div>
    <div class="box half real"><div class="pic" style="background-image:url('${CR.photo}');background-position:${CR.photo_pos || "center"}"></div>
      <div class="lab fun">📷 可能的真身</div>${CR.tag ? `<div class="depth fun">${CR.tag}</div>` : ""}<div class="credit3 en">${CR.credit}</div></div></div>
  <div class="name"><div class="zh fun">${CR.name_zh}</div>
    <div class="en">${CR.parts.map(p => `<span><b>${p.en}</b><small class="fun">${p.zh}</small></span>`).join("<em>+</em>")}</div></div>
  <div class="stats">${CR.stats.map(s => `<div class="box st"><small class="fun">${s.k}</small><b class="fun">${s.v}</b></div>`).join("")}</div>
  <div class="box meters fun">${CR.meters.map(m => `<div>${m.label} ${meter(m.n, m.icon)}</div>`).join("")}</div>
  ${CR.boxes.map((x, i) => `<div class="box power fun b${i}"><b>${x.title}</b>${x.text}</div>`).join("")}
  ${CR.fast ? `<div class="brains">
    <div class="br">${ch("dog:surprise:120")}<div class="bub fun"><small>快脑袋：</small>${CR.fast}</div></div>
    <div class="br slow">${ch("owl:think:120:magnifier")}<div class="bub fun"><small>慢脑袋：</small>${CR.slow}</div></div></div>` : ""}
  ${foot(CR.foot || `收集怪物卡，凑齐一本档案！${NEXT("怪物档案")}`)}</section>`);
const W = D.words;
if (legacy("words") && W) cards.push(`<section class="card" id="c3">${topBar("🔤 波波鼠单词屋 · Word House", W.grammar ? `✏️ ${W.grammar}` : undefined)}
  <div class="intro">${ch("mouse:wave:190")}<div class="bub en">${W.intro}</div></div>
  ${W.items.map((w, i) => `<div class="box w c${i}"><div class="ico">${w.icon}</div><div class="wd">
    <div class="word en">${w.word}${w.new ? `<em class="fun">新词</em>` : ""}</div>
    <div class="cn fun">${w.cn}</div><div class="ex en">${hl(w.example, w.word)}</div></div></div>`).join("")}
  <div class="box task"><div class="fun">✍️ 轮到你：${W.task}</div>${lines(W.lines || 2)}</div>
  ${foot("主持：波波鼠 Boba Mouse")}</section>`);

// 挑战卡：默认一道中文谜题；仅在明确启用时兼容旧英文三关。
const P = D.challenge;
const answerText = value => escapeText(Array.isArray(value) ? value.join("；") : value ?? "");
if (legacy("challenge") && P) cards.push(`<section class="card${P.english?.length ? " with-english" : ""}" id="c5">${topBar("🧩 捣蛋浣熊的挑战")}
  <div class="taunt">${ch("raccoon:smirk:136:" + (P.prop || ""))}<div class="bub"><span class="taunt-text">${wrapChineseWords(P.taunt_zh)}</span>${P.english?.length && P.taunt_en ? `<span class="en">${escapeText(P.taunt_en)}</span>` : ""}</div></div>
  <div class="puz"><div class="puzzle-label">浣熊出题</div><h3 class="fun">${wrapChineseWords(P.puzzle.title)}</h3><div class="body">${wrapChineseWords(P.puzzle.body)}</div>
    ${P.puzzle.clues?.length ? `<div class="clue-label">${P.puzzle.clues.length} 条线索 · 每条都要满足</div><ol class="clues">${P.puzzle.clues.map(clue => `<li><span>${wrapChineseWords(clue)}</span></li>`).join("")}</ol>` : ""}
    ${P.puzzle.question ? `<div class="question"><b>你来判断</b><span>${wrapChineseWords(P.puzzle.question)}</span></div>` : ""}</div>
  ${P.english?.length ? `<div class="route">${P.english.map((e, i) => `<div class="box lv l${i}"><div class="st fun">第${i + 1}关<b>${"⭐".repeat(e.stars)}</b></div>
    <div class="q"><div class="cn fun">${e.cn}</div><div class="en">${e.en}</div></div></div>`).join("")}</div>` : ""}
  <div class="answer-key"><div class="answer-content"><b>参考答案 · 想好再看</b><p class="puzzle-key">${answerText(D._answers?.puzzle)}</p>
    ${P.english?.length ? `<p class="english-key">英文：${(D._answers?.english || []).map((answer, i) => `${i + 1}. ${answerText(answer)}`).join("　")}</p>` : ""}</div></div>
  ${foot("想好了？转动平板，核对本页答案")}</section>`);

// 环球小报（可选）：1 条头条 + 2 条小新闻
const NW = D.news;
const story = (n, cls) => `<div class="box nw ${cls}"><div class="pic" style="background-image:url('${n.photo}');background-position:${n.photo_pos || "center"}"></div>
  <div class="txt"><div class="loc fun">${n.flag} ${n.place}</div><h3 class="fun">${n.title}</h3><p>${n.text}${n.word ? `<span class="kw en">🔑 ${n.word.en} <small class="fun">${n.word.zh}</small></span>` : ""}</p></div></div>`;
if (legacy("news") && NW) cards.push(`<section class="card" id="cnews">${topBar("🌏 环球小报 · World News", NW.week)}
  ${story(NW.items[0], "lead")}
  <div class="pair">${NW.items.slice(1, 3).map(n => story(n, "")).join("")}</div>
  <div class="box ask2 fun">💬 ${NW.ask_zh}<br><span class="en">${NW.ask_en}</span></div>
  <div class="credit2 en">${NW.credits}</div>
  ${foot(NW.foot || `新闻来源已交叉核实${NEXT("环球小报")}`)}</section>`);

// 真的假的（每天一页）：一条网上流传的说法，快脑袋先投票，慢脑袋按线索查，答案倒着印；有思维课表时选项和查证工具跟着本周换
const CK = D.check;
const CK_CHOICES = CK?.choices ?? ["✅ 真的", "❌ 假的", "🤔 说不清"];
const CK_TOOLS = CK?.tools ?? [["👤 谁说的？", "他怎么知道的"], ["🧪 有证据吗？", "实验、照片、数字"], ["📚 别处怎么说？", "再找一个来源"]];
if (legacy("check") && CK) cards.push(`<section class="card" id="ccheck">${topBar("🕵️ 真的假的 · True or False?")}
  <div class="box post${CK.photo ? " has-pic" : ""}"><div class="txt"><div class="ph fun">📱 ${CK.where}</div><div class="claim fun">${CK.claim}</div><div class="likes en">👍 ${CK.likes || "10万+"}　💬 ${CK.comments || "2,333"}</div></div>
    ${CK.photo ? `<div class="pic" style="background-image:url('${CK.photo}');background-position:${CK.photo_pos || "center"}"></div>` : ""}</div>
  <div class="vote fun">你的快脑袋说：${CK_CHOICES.map(c => `<span>${c}</span>`).join("")}</div>
  <div class="tools fun">${CK_TOOLS.map(([t, s]) => `<span>${t}<small>${s}</small></span>`).join("")}</div>
  <div class="box clues fun"><h3>🦉 慢脑袋查一查</h3>${CK.clues.map((c, i) => `<p><b>${i + 1}</b>${c}</p>`).join("")}</div>
  <div class="box mine fun"><h3>🕵️ 我的结论：${CK.choices ? CK_CHOICES.map(c => c.replace(/^\S+\s/, "")).join(" / ") : "真 / 假"}，因为……</h3>${lines(2)}</div>
  <div class="upside fun"><span>👀 倒过来看答案：</span>${CK.verdict}</div>
  ${CK.credit ? `<div class="credit2 en">${CK.credit}</div>` : ""}
  ${foot(`看完再倒过来对答案${NEXT("真的假的")}`)}</section>`);

// 经典连载（可选）：书一期一回；周五换成音乐盒 / 放映室 / 动手做
const SR = D.serial;
if (legacy("serial") && SR) cards.push(`<section class="card ${SR.kind}" id="cserial">${topBar(`${SERIAL[0]} ${SERIAL[1]} · ${SERIAL[2]}`, SR.kind === "book" ? `第 ${SR.ep} 回` : undefined)}
  <div class="h1 fun">${SR.kind === "book" ? `《${SR.book_zh}》` : ""}${SR.title_zh}<span class="en">${SR.kind === "book" ? `${SR.book_en} · ${SR.title_en}` : SR.title_en}</span></div>
  <div class="meta fun">${SR.kind === "book" ? `${SR.chapter}　·　${SR.author}` : SR.by}</div>
  ${(SR.diagram || SR.steps) && SR.photo ? `<div class="box done"><div class="img" style="background-image:url('${SR.photo}');background-position:${SR.photo_pos || "center"}"></div><div class="lb fun">做好是这样</div><div class="credit3 en">${SR.photo_credit}</div></div>` : ""}
  <div class="text">${SR.diagram || SR.steps ? "" : `<div class="box pic"><div class="img" style="background-image:url('${SR.photo}');background-position:${SR.photo_pos || "center"}"></div><div class="credit3 en">${SR.photo_credit}</div></div>`}
    ${SR.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>
  ${SR.steps
    ? `<div class="box grid fun" style="--cols:${SR.steps.length > 9 ? 4 : 3};--rows:${Math.ceil(SR.steps.length / (SR.steps.length > 9 ? 4 : 3))}">${SR.steps.map((s, i) => `<div class="cell"><div class="img" style="background-image:url('${s}')"></div><p><b>${i + 1}</b>${SR.tasks[i]}</p></div>`).join("")}
    <small>${SR.where ? `${SR.where}　·　` : ""}<span class="en">图式 ${SR.diagram_credit}</span></small></div>`
    : SR.diagram
    ? `<div class="box diagram"><div class="img" style="background-image:url('${SR.diagram}')"></div><div class="credit3 en">${SR.diagram_credit}</div></div>
  <div class="box tasks steps fun">${SR.tasks.map((t, i) => `<p><b>${i + 1}</b>${t}</p>`).join("")}${SR.where ? `<small>${SR.where}</small>` : ""}</div>`
    : SR.kind === "book"
    ? `<div class="box quote"><div class="lb fun">📜 原著金句 · ${SR.quote.who}</div><div class="en">${/^[“"]/.test(SR.quote.en) ? SR.quote.en : `“${SR.quote.en}”`}</div><div class="zh fun">${SR.quote.zh}</div></div>`
    : `<div class="box tasks fun"><div class="lb">${{ music: "🎧 边听边找", film: "🍿 看完考考你", make: "✂️ 跟着做" }[SR.kind]}</div>${SR.tasks.map((t, i) => `<p><b>${i + 1}</b>${t}</p>`).join("")}${SR.where ? `<small>${SR.where}</small>` : ""}</div>`}
  <div class="end"><div class="crew">${ch(SR.crew.who)}<div class="bub fun">${SR.crew.say}</div></div>
    <div class="next fun">${SR.guess ? `<span class="guess">🔮 猜一猜：${SR.guess}</span>` : ""}<span>${SR.tbc}</span></div></div>
  ${foot(SR.foot || NEXT(SERIAL[1]).replace(/^ · /, "") || "明天见！See you tomorrow!")}</section>`);

// 周末思辨（周五）：一个两边都有道理的话题，孩子先写下想法，周六和家人聊
const TK = D.think;
if (legacy("think") && TK) cards.push(`<section class="card" id="cthink">${topBar("🗣️ 周末思辨 · Big Talk", "周六聊一聊")}
  <div class="h1 fun">${TK.title}${TK.title_en ? `<span class="en">${TK.title_en}</span>` : ""}</div>
  <div class="box story fun${TK.photo ? " has-pic" : ""}">${TK.photo ? `<div class="pic" style="background-image:url('${TK.photo}');background-position:${TK.photo_pos || "center"}"></div>` : ""}<p>${TK.story}</p></div>
  <div class="sides">${TK.sides.map((x, i) => `<div class="side s${i}"><div class="bub fun">${x.say}</div><div class="char-stage">${ch(x.who)}</div></div>`).join(`<div class="vs-emblem en">VS</div>`)}</div>
  <div class="box role fun"><b>🎭 换你来</b>${TK.role}</div>
  <div class="box deeper fun"><b>🤔 再想深一点</b>${TK.deeper.map(q => `<p>${q}</p>`).join("")}</div>
  <div class="box mine fun"><h3>✏️ 我的想法：______，因为……</h3>${lines(2)}
    <div class="after">周六聊完，我的想法：<span>没变</span><span>变了一点</span><span>完全变了</span></div></div>
  ${TK.credit ? `<div class="credit2 en">${TK.credit}</div>` : ""}
  ${foot(`周六和家人聊一聊，听听别人怎么想${NEXT("周末思辨")}`)}</section>`);

// 信箱（最后一页）：几句关于本期的问题，孩子口头答、家长拍照或转述都行
const M = D.mailbox;
const picks = (items, many) => `<div class="pick${many ? " many" : ""}">${items.map(x => `<span>${x}</span>`).join("")}</div>`;
const PAGES = TOC.filter(([, t]) => t !== "信箱").map(([e, t]) => e + t);
if (legacy("mailbox") && M) cards.push(`<section class="card" id="c6">${topBar("💌 编辑部信箱 · Mailbox")}
  <div class="box letter fun">${M.hello || M.letter}</div>
  <div class="box checkin fun"><h3>📝 今天这期，告诉编辑部</h3>
    <div class="row"><b>👍 最喜欢哪一页？</b>${picks(PAGES, PAGES.length > 5)}</div>
    <div class="row"><b>👎 哪一页不太喜欢？</b>${picks(PAGES, PAGES.length > 5)}</div>
    <div class="row"><b>今天难不难？</b>${picks(["😴 太简单", "🤔 刚刚好", "🤯 有点难"])}</div>
    <div class="row"><b>💡 今天想到了什么有趣的问题？</b>${lines(2)}</div>
    <div class="row"><b>👀 今天看到了什么有意思的事？</b>${lines(2)}</div>
    ${M.ask_zh ? `<div class="row"><b>❓ ${M.ask_zh}</b>${lines(1)}</div>` : ""}</div>
  ${foot((M.send_note || "说给家长听") + " · 明天见！See you tomorrow!")}</section>`);

upTo(null);
document.getElementById("root").outerHTML = cards.join("\n").replaceAll("{{TOTAL}}", kit.pages());
[...document.querySelectorAll(".card")].at(-1)?.classList?.add("is-last");
// The renderer and narration validator share the same page contract.
const CARD_IDS = {{CARD_IDS}};
// 一个注册栏目可以出几页，几页连在一起算一个 id
const cardId = c => c.closest(".section")?.id ?? c.id;
const actualIds = [...document.querySelectorAll(".card")].map(cardId).filter((id, i, all) => id !== all[i - 1]);
if (JSON.stringify(actualIds) !== JSON.stringify(CARD_IDS)) throw new Error(`页面顺序与数据契约不一致：${actualIds.join(",")}，应为 ${CARD_IDS.join(",")}`);
if (location.hash) { document.body.classList.add("single"); const el = document.querySelector(location.hash); (el.matches(".card") ? el : el.querySelector(".card")).classList.add("on"); }

// 刊名条取色：照片可见区域最上面 5% 的平均色；太灰就提一点亮度。JSON 写了 cover.strip 就用它。
// 刊名用深字还是白字，按刊名条的亮度定。render.mjs 截图前会等 window.READY
async function coverStrip() {
  const card = document.querySelector("#c1.photo-cover");
  if (!card) return;
  let rgb;
  if (CV.strip) {
    const c = document.createElement("canvas").getContext("2d");
    c.fillStyle = CV.strip; c.fillRect(0, 0, 1, 1); rgb = [...c.getImageData(0, 0, 1, 1).data].slice(0, 3);
  } else {
    const box = card.querySelector(".photo"), img = new Image();
    img.src = CV.photo; await img.decode();
    const W = box.clientWidth, H = box.clientHeight, s = Math.max(W / img.width, H / img.height);
    const pos = getComputedStyle(box).backgroundPosition.split(" ").map(v => v.endsWith("%") ? parseFloat(v) / 100 : 0.5);
    const vw = W / s, vh = H / s, x0 = (img.width - vw) * pos[0], y0 = (img.height - vh) * (pos[1] ?? 0.5);
    const cv = document.createElement("canvas"); cv.width = 32; cv.height = 2;
    const c = cv.getContext("2d"); c.drawImage(img, x0, y0, vw, vh * 0.05, 0, 0, 32, 2);
    const px = c.getImageData(0, 0, 32, 2).data; rgb = [0, 0, 0];
    for (let i = 0; i < px.length; i += 4) for (let k = 0; k < 3; k++) rgb[k] += px[i + k] / 64;
    const [mx, mn] = [Math.max(...rgb), Math.min(...rgb)];
    if (mx - mn < 30 && mx < 200) rgb = rgb.map(v => Math.min(255, v + 24)); // 灰蒙蒙的天：提亮一点
    card.style.setProperty("--strip", `rgb(${rgb.map(Math.round).join(",")})`);
  }
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  card.classList.add(lum > 0.6 ? "light" : "dark");
}
// 正文偏长时，把这几页最大的那块图缩一点，让页脚回到版心里（卡片 id、元素、CSS 变量、最高、最低）
const FIT = [
  ["c2", ".diagram svg", "--comic-diagram-height", 280, 200],
  ["cdeep", ".card-photo", "--creature-photo-height", 380, 300],
  ["cnews", ".lead .pic", "--news-lead-height", 320, 240],
];
function fitCards() {
  for (const [id, sel, prop, max, min] of FIT) {
    const card = document.querySelector(`#${id}`), el = card?.querySelector(sel), foot = card?.querySelector(".foot");
    if (!el || !foot || !card.getBoundingClientRect().height) continue;
    card.style.setProperty(prop, `${max}px`);
    const limit = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom);
    const excess = Math.max(0, Math.ceil(foot.getBoundingClientRect().bottom - limit));
    card.style.setProperty(prop, `${Math.max(min, max - excess)}px`);
  }
}
function fitChallengeLayout() {
  const card = document.querySelector("#c5"), foot = card?.querySelector(".foot");
  if (!foot || !card.getBoundingClientRect().height) return;
  card.classList.remove("challenge-compact", "challenge-roomy");
  const limit = card.getBoundingClientRect().bottom - parseFloat(getComputedStyle(card).paddingBottom);
  const overflows = () => foot.getBoundingClientRect().bottom > limit + 1;
  if (overflows()) return card.classList.add("challenge-compact");
  const puz = card.querySelector(".puz"), key = card.querySelector(".answer-key");
  if (puz && key && !card.classList.contains("with-english") && key.getBoundingClientRect().top - puz.getBoundingClientRect().bottom > 150) {
    card.classList.add("challenge-roomy");
    if (overflows()) card.classList.remove("challenge-roomy");
  }
}
window.READY = Promise.all([coverStrip(), characterPackReady]).then(async () => {
  await document.fonts?.ready;
  fitCards();
  fitChallengeLayout();
});
</script>
